[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaitlogic-planner"
version = "0.10.3"
description = "Training plan and log database layer for serious runners."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
    "SQLAlchemy>=2.0,<3.0",
    "PyMySQL>=1.1,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pytest>=8.0,<9.0",
    "openpyxl>=3.1,<4.0",
    "PyYAML>=6.0,<7.0",
    "python-multipart>=0.0.9,<1.0",
    "openai>=1.0,<2.0",
    "cryptography>=42.0,<47.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["planner_core", "planner_core.*", "server", "server.*"]
exclude = [
    "config",
    "config.*",
    "docs",
    "docs.*",
    "gaitlogic-noomi",
    "gaitlogic-noomi.*",
    "knowledge",
    "knowledge.*",
    "md",
    "md.*",
    "scripts",
    "scripts.*",
    "sql",
    "sql.*",
    "templates",
    "templates.*",
    "tests",
    "tests.*",
    "web",
    "web.*",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
