global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: otel-collector-exported
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: evaluation-metrics
    static_configs:
      - targets: [evaluation-metrics:9464]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
