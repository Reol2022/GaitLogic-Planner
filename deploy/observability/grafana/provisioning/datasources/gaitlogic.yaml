apiVersion: 1
prune: true
datasources:
  - name: GaitLogic Prometheus
    uid: gaitlogic-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: GaitLogic Tempo
    uid: gaitlogic-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: gaitlogic-prometheus
        tags: [{ key: service.name, value: service_name }]
  - name: GaitLogic Jaeger
    uid: gaitlogic-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
